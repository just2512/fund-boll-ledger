name: Frontend Checks (GitHub-hosted)

on:
  push:
    branches: [main, 'feat/**', 'test/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub-hosted toolchain
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test
      - name: Type-check and production build
        run: npm run build
