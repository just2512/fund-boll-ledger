name: Frontend Checks (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Unit tests and production build
    runs-on: [self-hosted, Linux, X64, wsl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Linux toolchain
        shell: bash
        run: |
          set -e
          node --version
          npm --version
          case "$(command -v npm)" in
            /mnt/c/*) echo "Windows npm leaked into WSL PATH"; exit 1 ;;
          esac
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test
      - name: Type-check and production build
        run: npm run build
