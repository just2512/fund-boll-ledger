name: Live Technical Acceptance and Multi-ETF Calibration

on:
  push:
    branches: [main, 'work/technical-state-information-architecture']
    paths:
      - 'src/market-data.ts'
      - 'src/macd.ts'
      - 'src/macd.test.ts'
      - 'src/technical-state/types.ts'
      - 'src/technical-state/series.ts'
      - 'src/technical-state/series.test.ts'
      - 'src/technical-state/history-replay.ts'
      - 'src/technical-state/boll-state.ts'
      - 'src/technical-state/boll-state.test.ts'
      - 'src/technical-state/engine.ts'
      - 'src/technical-state/engine.test.ts'
      - 'src/technical-state/boll-macd-events.ts'
      - 'src/technical-state/boll-macd-events.test.ts'
      - 'src/technical-state/calibration.ts'
      - 'src/technical-state/calibration.test.ts'
      - 'src/technical-state/real-data.acceptance.live.test.ts'
      - 'src/technical-state/real-data.calibration.live.test.ts'
      - 'src/technical-state/sensitivity.ts'
      - 'src/technical-state/sensitivity.test.ts'
      - 'src/technical-state/macd-seed-sensitivity.ts'
      - 'src/technical-state/macd-seed-sensitivity.test.ts'
      - 'scripts/run-live-technical-acceptance.mjs'
      - 'scripts/run-live-technical-calibration.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/technical-state-calibration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/market-data.ts'
      - 'src/macd.ts'
      - 'src/macd.test.ts'
      - 'src/technical-state/types.ts'
      - 'src/technical-state/series.ts'
      - 'src/technical-state/series.test.ts'
      - 'src/technical-state/history-replay.ts'
      - 'src/technical-state/boll-state.ts'
      - 'src/technical-state/boll-state.test.ts'
      - 'src/technical-state/engine.ts'
      - 'src/technical-state/engine.test.ts'
      - 'src/technical-state/boll-macd-events.ts'
      - 'src/technical-state/boll-macd-events.test.ts'
      - 'src/technical-state/calibration.ts'
      - 'src/technical-state/calibration.test.ts'
      - 'src/technical-state/real-data.acceptance.live.test.ts'
      - 'src/technical-state/real-data.calibration.live.test.ts'
      - 'src/technical-state/sensitivity.ts'
      - 'src/technical-state/sensitivity.test.ts'
      - 'src/technical-state/macd-seed-sensitivity.ts'
      - 'src/technical-state/macd-seed-sensitivity.test.ts'
      - 'scripts/run-live-technical-acceptance.mjs'
      - 'scripts/run-live-technical-calibration.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/technical-state-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    name: Real-data acceptance and multi-ETF calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub-hosted toolchain
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Verify patched dependency versions
        run: npm run test:dependency-security
      - name: Verify execution contract and technical-state requirements matrix
        run: npm run verify:execution-contract
      - name: Run real-data technical acceptance (510300)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run test:technical-live 2>&1 | tee artifacts/technical-state-acceptance.log
      - name: Run live multi-ETF calibration
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run calibrate:technical-live 2>&1 | tee artifacts/technical-state-calibration.log
      - name: Upload live technical reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-technical-acceptance-and-calibration
          path: artifacts/*.log
          if-no-files-found: warn
          retention-days: 30
