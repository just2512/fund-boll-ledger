name: Native App Build (manual)

on:
  workflow_dispatch:
    # Deliberately manual to avoid consuming Actions minutes on every push.

permissions:
  contents: read

jobs:
  # Windows installer on GitHub-hosted runner. The project can also be built
  # locally with scripts/build-windows.ps1; this job is the cloud fallback.
  windows:
    name: Windows desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Generate app icons
        run: cargo tauri icon public/icon.svg
      - name: Test and build
        run: |
          npm run test
          npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: fund-boll-ledger-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/fund-boll-ledger.exe
          if-no-files-found: error
          retention-days: 14

  # Android ARM64 APK on the user's WSL self-hosted runner (already provisioned:
  # JDK 17, Android SDK platform-36/build-tools 36.0.0/NDK 28.2.13676358,
  # Rust stable + aarch64-linux-android target, tauri-cli 2.11.4).
  android:
    name: Android ARM64 APK (self-hosted WSL)
    runs-on: [self-hosted, Linux, X64, wsl]
    steps:
      - uses: actions/checkout@v4
      - name: Set up toolchain environment
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$HOME/android-sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify Android SDK and NDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$HOME/.cargo/bin/cargo-tauri"
          which npm | grep -v /mnt/c || export PATH="/usr/bin:$PATH"
          java -version
          rustc --version
          cargo tauri --version
      - name: Install frontend dependencies
        run: npm install
      - name: Generate app icons
        run: cargo tauri icon public/icon.svg
      - name: Initialize Android project
        run: cargo tauri android init --ci
      - name: Build ARM64 APK
        run: cargo tauri android build --apk --target aarch64 --ci
      - name: Sign ARM64 APK with debug keystore
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/36.0.0"
          KS="$RUNNER_TEMP/android-debug.keystore"
          keytool -genkeypair -keystore "$KS" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android \
            -keypass android -dname "CN=Android Debug,O=Android,C=US"
          APK=$(find src-tauri/gen/android/app/build/outputs -name "*universal-release-unsigned.apk" | head -1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/signed.apk"
          mkdir -p artifacts
          cp "$RUNNER_TEMP/signed.apk" "artifacts/基金阶梯账本-${{ github.ref_name }}-arm64-signed.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: fund-boll-ledger-android-arm64
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
