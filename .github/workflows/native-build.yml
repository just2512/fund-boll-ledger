name: Native App Build (manual)

on:
  workflow_dispatch:
    # Deliberately manual to avoid consuming Actions minutes on every push.

permissions:
  contents: read

jobs:
  # Windows installer on GitHub-hosted runner. The project can also be built
  # locally with scripts/build-windows.ps1; this job is the cloud fallback.
  windows:
    name: Windows desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Generate app icons
        run: cargo tauri icon public/icon.svg
      - name: Test and build
        run: |
          npm run test
          npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: fund-boll-ledger-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/fund-boll-ledger.exe
          if-no-files-found: error
          retention-days: 14

  # Android ARM64 APK on a GitHub-hosted Linux runner. All toolchains are
  # provisioned in the job; no persistent self-hosted machine is required.
  android:
    name: Android ARM64 APK (GitHub-hosted)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Set up Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Verify Android toolchain
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          java -version
          rustc --version
          cargo tauri --version
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate app icons
        run: cargo tauri icon public/icon.svg
      - name: Initialize Android project
        run: cargo tauri android init --ci
      - name: Build ARM64 APK
        run: cargo tauri android build --apk --target aarch64 --ci
      - name: Sign ARM64 APK with debug keystore
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/36.0.0"
          KS="$RUNNER_TEMP/android-debug.keystore"
          keytool -genkeypair -keystore "$KS" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android \
            -keypass android -dname "CN=Android Debug,O=Android,C=US"
          APK=$(find src-tauri/gen/android/app/build/outputs -name "*universal-release-unsigned.apk" | head -1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/signed.apk"
          mkdir -p artifacts
          cp "$RUNNER_TEMP/signed.apk" "artifacts/基金阶梯账本-${{ github.ref_name }}-arm64-signed.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: fund-boll-ledger-android-arm64
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
